baseURL = 'https://andrewchiw.dev/'
locale = 'en-us'
title = 'Everything is Connected'
theme = 'PaperMod'

# Header logo: wordmark + node-graph icon. `hideText = true` drops the
# wordmark and leaves the icon only (see layouts/_partials/header.html).
[params.label]
text = 'Everything is Connected'
hideText = false
iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="12" r="2.5"></circle><circle cx="18.5" cy="5.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle><path d="M7.9 10.8 16.1 6.7"></path><path d="M7.9 13.2l8.2 4.1"></path><path d="M18.5 8v8"></path></svg>'

timeZone = 'Asia/Tokyo'
enableRobotsTXT = true
enableGitInfo = false

hasCJKLanguage = false

[pagination]
pagerSize = 10

[params]
description = 'Porting Go to 32-bit PowerPC with a fleet of AI agents. Field notes on compiler ports, old Macs and agent fleets.'
author = 'Andrew Chiw'
keywords = ['PowerPC', 'Go', 'compiler port', 'AI agents', 'darwin/ppc', 'trading']

# Home is a plain list of posts: no profile card, no intro blurb.
profileMode.enabled = false
mainSections = ['posts']

ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = true
hideSummary = true
comments = false


[[menu.main]]
identifier = 'posts'
name = 'Posts'
url = '/'
weight = 10

[[menu.main]]
identifier = 'about'
name = 'About'
url = '/about/'
weight = 20

[[menu.main]]
identifier = 'search'
name = 'Search'
url = '/search/'
weight = 30

[params.appearance]
disableThemeToggle = false
defaultTheme = 'auto'

[markup]
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = false
style = 'monokai'
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[taxonomies]
tag = 'tags'
category = 'categories'

[outputs]
home = ['HTML', 'RSS']

[security.funcs]
getenv = ['^HUGO_', '^CI$']
