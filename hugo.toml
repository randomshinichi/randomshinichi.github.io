baseURL = 'https://andrewchiw.dev/'
locale = 'en-us'
title = 'Andrew Chiw'
theme = 'PaperMod'

timeZone = 'Asia/Tokyo'
enableRobotsTXT = true
enableGitInfo = false

hasCJKLanguage = false

[pagination]
pagerSize = 10

[params]
description = 'Notes on ports, PowerPC Macs, AI agent fleets and trading.'
author = 'Andrew Chiw'
keywords = ['PowerPC', 'Go', 'compiler port', 'AI agents', 'trading']

# Home is a plain list of posts: no profile card, no intro blurb.
profileMode.enabled = false
mainSections = ['posts']

ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = true
hideSummary = true
comments = false

[params.label]
text = 'Andrew Chiw'

[[menu.main]]
identifier = 'posts'
name = 'Posts'
url = '/'
weight = 10

[[menu.main]]
identifier = 'about'
name = 'About'
url = '/about/'
weight = 20

[[menu.main]]
identifier = 'search'
name = 'Search'
url = '/search/'
weight = 30

[params.appearance]
disableThemeToggle = false
defaultTheme = 'auto'

[markup]
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = false
style = 'monokai'
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[taxonomies]
tag = 'tags'
category = 'categories'

[outputs]
home = ['HTML', 'RSS']

[security.funcs]
getenv = ['^HUGO_', '^CI$']
