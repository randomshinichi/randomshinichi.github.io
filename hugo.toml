baseURL = 'https://andrewchiw.dev/'
locale = 'en-us'
title = 'Port Authority'
theme = 'PaperMod'

# Header logo label; empty so the site name is not rendered twice
# (header logo + page <h1>). Site title still appears in <title>.
[params.label]
text = 'Port Authority'
hideText = true
iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 16V9h3.4a2.6 2.6 0 0 1 0 5.2H10"></path></svg>'

timeZone = 'Asia/Tokyo'
enableRobotsTXT = true
enableGitInfo = false

hasCJKLanguage = false

[pagination]
pagerSize = 10

[params]
description = 'Porting Go to 32-bit PowerPC with a fleet of AI agents. Field notes on compiler ports, old Macs and agent fleets.'
author = 'Andrew Chiw'
keywords = ['PowerPC', 'Go', 'compiler port', 'AI agents', 'darwin/ppc', 'trading']

# Home is a plain list of posts: no profile card, no intro blurb.
profileMode.enabled = false
mainSections = ['posts']

ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = true
hideSummary = true
comments = false


[[menu.main]]
identifier = 'posts'
name = 'Posts'
url = '/'
weight = 10

[[menu.main]]
identifier = 'about'
name = 'About'
url = '/about/'
weight = 20

[[menu.main]]
identifier = 'search'
name = 'Search'
url = '/search/'
weight = 30

[params.appearance]
disableThemeToggle = false
defaultTheme = 'auto'

[markup]
[markup.highlight]
codeFences = true
guessSyntax = true
lineNos = false
style = 'monokai'
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[taxonomies]
tag = 'tags'
category = 'categories'

[outputs]
home = ['HTML', 'RSS']

[security.funcs]
getenv = ['^HUGO_', '^CI$']
